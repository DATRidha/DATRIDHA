name: Build DATRIDHA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare complete Android project
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          unzip -q DATRIDHA_project_COLORED_FUNCTIONAL_FINAL.zip -d build_project
          unzip -qo DATRIDHA_READY_BUILD.zip -d build_project

      - name: Find Gradle project
        run: |
          set -e

          SETTINGS=$(find build_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Install DATRIDHA visual assets
        run: |
          set -e

          echo "Installing DATRIDHA visual assets..."

          rm -rf build_project/datridha_assets
          mkdir -p build_project/datridha_assets

          unzip -q DATRIDHA_UI_ASSETS_READY.zip \
            -d build_project/datridha_assets

          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable"

          rm -f "$PROJECT_DIR/app/src/main/res/drawable/splash_oasis.png"
          rm -f "$PROJECT_DIR/app/src/main/res/drawable/oasis_home.png"
          rm -f "$PROJECT_DIR/app/src/main/res/drawable/dates_deglet_nour.png"
          rm -f "$PROJECT_DIR/app/src/main/res/drawable/app_icon.png"

          cp build_project/datridha_assets/splash_bg.png \
            "$PROJECT_DIR/app/src/main/res/drawable/splash_oasis.png"

          cp build_project/datridha_assets/oasis_home.png \
            "$PROJECT_DIR/app/src/main/res/drawable/oasis_home.png"

          cp build_project/datridha_assets/dates_deglet_nour.png \
            "$PROJECT_DIR/app/src/main/res/drawable/dates_deglet_nour.png"

          cp build_project/datridha_assets/app_icon.png \
            "$PROJECT_DIR/app/src/main/res/drawable/app_icon.png"

          echo "Visual assets installed:"
          ls -lh "$PROJECT_DIR/app/src/main/res/drawable/"

      - name: Apply latest app code
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/app/src/main/java/com/datridha/app"

          cp project/app/src/main/java/com/datridha/app/MainActivity.java \
             "$PROJECT_DIR/app/src/main/java/com/datridha/app/MainActivity.java"

      - name: Upgrade DATRIDHA visual layout
        run: |
          set -e

          python3 - "$PROJECT_DIR/app/src/main/java/com/datridha/app/MainActivity.java" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # -----------------------------------------------------
          # 1. Make splash screen a real full-screen photo layout
          # -----------------------------------------------------

          start = text.index("    void showSplash() {")

          end = text.index(
              "    // =========================================================\n"
              "    // HOME",
              start
          )

          splash = r'''    void showSplash() {

        currentPage = "splash";

        final FrameLayout frame =
                new FrameLayout(this);

        ImageView background =
                new ImageView(this);

        background.setImageResource(
                R.drawable.splash_oasis
        );

        background.setScaleType(
                ImageView.ScaleType.CENTER_CROP
        );

        frame.addView(
                background,
                new FrameLayout.LayoutParams(
                        -1,
                        -1
                )
        );

        View darkLayer =
                new View(this);

        GradientDrawable overlay =
                new GradientDrawable(
                        GradientDrawable.Orientation.TL_BR,
                        new int[]{
                                Color.argb(25,0,0,0),
                                Color.argb(15,0,0,0),
                                Color.argb(120,0,55,25)
                        }
                );

        darkLayer.setBackground(overlay);

        frame.addView(
                darkLayer,
                new FrameLayout.LayoutParams(
                        -1,
                        -1
                )
        );

        LinearLayout content =
                new LinearLayout(this);

        content.setOrientation(
                LinearLayout.VERTICAL
        );

        content.setGravity(
                Gravity.CENTER_HORIZONTAL
        );

        content.setPadding(
                20,
                30,
                20,
                20
        );

        FrameLayout.LayoutParams contentLp =
                new FrameLayout.LayoutParams(
                        -1,
                        -1
                );

        frame.addView(
                content,
                contentLp
        );

        ImageView logo =
                new ImageView(this);

        logo.setImageResource(
                R.drawable.logo_datridha
        );

        logo.setScaleType(
                ImageView.ScaleType.CENTER_INSIDE
        );

        content.addView(
                logo,
                new LinearLayout.LayoutParams(
                        -1,
                        150
                )
        );

        TextView ar =
                text(
                        "دقلة النور من بشني",
                        22,
                        WHITE,
                        true
                );

        ar.setGravity(
                Gravity.CENTER
        );

        content.addView(ar);

        TextView fr =
                text(
                        "Deglet Nour de Bechni",
                        16,
                        WHITE,
                        true
                );

        fr.setGravity(
                Gravity.CENTER
        );

        content.addView(fr);

        TextView slogan =
                text(
                        "Achetez • Vendez • Échangez",
                        15,
                        WHITE,
                        true
                );

        slogan.setGravity(
                Gravity.CENTER
        );

        content.addView(slogan);

        Space space =
                new Space(this);

        content.addView(
                space,
                new LinearLayout.LayoutParams(
                        1,
                        0,
                        1
                )
        );

        ImageView dates =
                new ImageView(this);

        dates.setImageResource(
                R.drawable.dates_deglet_nour
        );

        dates.setScaleType(
                ImageView.ScaleType.CENTER_CROP
        );

        GradientDrawable datesBg =
                new GradientDrawable();

        datesBg.setColor(
                Color.TRANSPARENT
        );

        datesBg.setCornerRadius(
                28
        );

        dates.setBackground(datesBg);

        dates.setClipToOutline(true);

        content.addView(
                dates,
                new LinearLayout.LayoutParams(
                        -1,
                        175
                )
        );

        Button startButton =
                button(
                        tr(
                                "ابدأ الآن",
                                "Commencer",
                                "Start now"
                        ),
                        GREEN
                );

        startButton.setTextSize(18);

        LinearLayout.LayoutParams startLp =
                new LinearLayout.LayoutParams(
                        -1,
                        60
                );

        startLp.setMargins(
                0,
                12,
                0,
                8
        );

        content.addView(
                startButton,
                startLp
        );

        startButton.setOnClickListener(
                v -> showHome()
        );

        LinearLayout languages =
                new LinearLayout(this);

        languages.setGravity(
                Gravity.CENTER
        );

        String[] languageNames = {
                "Français",
                "العربية",
                "English"
        };

        for(String item : languageNames) {

            TextView languageButton =
                    text(
                            item,
                            13,
                            GREEN,
                            true
                    );

            languageButton.setGravity(
                    Gravity.CENTER
            );

            GradientDrawable languageBg =
                    new GradientDrawable();

            languageBg.setColor(
                    Color.argb(
                            225,
                            255,
                            255,
                            255
                    )
            );

            languageBg.setCornerRadius(
                    30
            );

            languageButton.setBackground(
                    languageBg
            );

            LinearLayout.LayoutParams lp =
                    new LinearLayout.LayoutParams(
                            0,
                            46,
                            1
                    );

            lp.setMargins(
                    4,
                    0,
                    4,
                    0
            );

            languages.addView(
                    languageButton,
                    lp
            );

            if(item.equals("العربية")) {

                languageButton.setOnClickListener(
                        v -> {
                            language = "ar";
                            showSplash();
                        }
                );

            } else if(item.equals("Français")) {

                languageButton.setOnClickListener(
                        v -> {
                            language = "fr";
                            showSplash();
                        }
                );

            } else {

                languageButton.setOnClickListener(
                        v -> {
                            language = "en";
                            showSplash();
                        }
                );
            }
        }

        content.addView(languages);

        setContentView(frame);
    }

'''

          text = text[:start] + splash + text[end:]

          # -----------------------------------------------------
          # 2. Make offer images larger
          # -----------------------------------------------------

          text = text.replace(
              '''new LinearLayout.LayoutParams(
                        -1,
                        125
                )''',
              '''new LinearLayout.LayoutParams(
                        -1,
                        165
                )'''
          )

          # -----------------------------------------------------
          # 3. Make offer details image larger
          # -----------------------------------------------------

          text = text.replace(
              '''new LinearLayout.LayoutParams(
                        -1,
                        240
                )''',
              '''new LinearLayout.LayoutParams(
                        -1,
                        300
                )'''
          )

          # -----------------------------------------------------
          # 4. Make contact image larger
          # -----------------------------------------------------

          text = text.replace(
              '''new LinearLayout.LayoutParams(
                        -1,
                        190
                )''',
              '''new LinearLayout.LayoutParams(
                        -1,
                        235
                )'''
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("DATRIDHA visual layout upgraded successfully.")
          PY

      - name: Apply DATRIDHA application icon
        run: |
          set -e

          MANIFEST=$(find "$PROJECT_DIR/app/src/main" \
            -name "AndroidManifest.xml" \
            -print -quit)

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if 'android:icon=' in text:
              text = re.sub(
                  r'android:icon="[^"]*"',
                  'android:icon="@drawable/app_icon"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  '<application',
                  '<application android:icon="@drawable/app_icon"',
                  1
              )

          if 'android:roundIcon=' in text:
              text = re.sub(
                  r'android:roundIcon="[^"]*"',
                  'android:roundIcon="@drawable/app_icon"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  '<application',
                  '<application android:roundIcon="@drawable/app_icon"',
                  1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("DATRIDHA application icon configured.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: |
          set -e

          gradle -p "$PROJECT_DIR" clean assembleDebug

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: DATRIDHA-FINAL-DESIGN
          path: build_project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build DATRIDHA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare DATRIDHA project
        run: |
          rm -rf project
          unzip -q DATRIDHA_project_COLORED_FUNCTIONAL_FINAL.zip -d project

      - name: Find and restore MainActivity
        run: |
          echo "Searching for MainActivity.java..."
          TARGET=$(find project -type f -name "MainActivity.java" | head -1)

          if [ -z "$TARGET" ]; then
            echo "ERROR: MainActivity.java was not found inside the ZIP project."
            echo "Files found:"
            find project -maxdepth 8 -type f | head -100
            exit 1
          fi

          echo "MainActivity found at:"
          echo "$TARGET"

          git show HEAD:project/app/src/main/java/com/datridha/app/MainActivity.java > "$TARGET"

          echo "MainActivity restored successfully."

      - name: Verify MainActivity
        run: |
          TARGET=$(find project -type f -name "MainActivity.java" | head -1)
          echo "===== MainActivity location ====="
          echo "$TARGET"
          echo "===== Class declaration ====="
          grep -n "class MainActivity" "$TARGET"
          echo "===== DATRIDHA references ====="
          grep -n "DATRIDHA" "$TARGET" | head -10

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."
          find project \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")
          echo "Gradle project: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find project -type f -name "app-debug.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DATRIDHA-FINAL
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

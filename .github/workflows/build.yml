name: Build DATRIDHA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Android project
        run: |
          set -e

          echo "========================================"
          echo "CHECKING DATRIDHA PROJECT"
          echo "========================================"

          if [ ! -f "project/settings.gradle" ] && [ ! -f "project/settings.gradle.kts" ]; then
            echo "ERROR: Android project not found in project/"
            echo ""
            echo "Available files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo ""
          echo "MainActivity:"
          find project -type f -name "MainActivity.java" -print

          echo ""
          echo "MainActivity size:"
          wc -c project/app/src/main/java/com/datridha/app/MainActivity.java

      - name: Show MainActivity
        run: |
          set -e

          echo "========================================"
          echo "USING CURRENT MAIN ACTIVITY"
          echo "========================================"

          head -30 project/app/src/main/java/com/datridha/app/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build DATRIDHA
        run: |
          set -e

          echo "========================================"
          echo "BUILDING CURRENT PROJECT"
          echo "========================================"

          gradle -p project clean assembleDebug

      - name: Find APK
        run: |
          set -e

          echo "========================================"
          echo "APK"
          echo "========================================"

          APK=$(find project -type f -name "app-debug.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo ""
          echo "SIZE:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DATRIDHA-FINAL-8-PAGES
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

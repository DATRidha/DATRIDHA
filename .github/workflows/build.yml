name: Build DATRIDHA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare DATRIDHA project
        run: |
          rm -rf project
          unzip -q DATRIDHA_project_COLORED_FUNCTIONAL_FINAL.zip -d project

      - name: Restore MainActivity
        run: |
          TARGET=$(find project -type f -name "MainActivity.java" | head -1)

          if [ -z "$TARGET" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi

          echo "TARGET=$TARGET"

          git show HEAD:project/app/src/main/java/com/datridha/app/MainActivity.java > "$TARGET"

      - name: Inspect MainActivity
        run: |
          TARGET=$(find project -type f -name "MainActivity.java" | head -1)

          echo "========================================"
          echo "MAIN ACTIVITY USED FOR BUILD"
          echo "========================================"

          echo "FILE:"
          echo "$TARGET"

          echo ""
          echo "SIZE:"
          wc -c "$TARGET"

          echo ""
          echo "FIRST 40 LINES:"
          head -40 "$TARGET"

          echo ""
          echo "DATRIDHA REFERENCES:"
          grep -n "DATRIDHA" "$TARGET" | head -20 || true

          echo ""
          echo "ACTIVITY DECLARATION:"
          grep -n "class MainActivity" "$TARGET" || true

      - name: Inspect Android Manifest
        run: |
          echo "========================================"
          echo "ANDROID MANIFEST FILES"
          echo "========================================"

          find project -type f -name "AndroidManifest.xml" -print

          echo ""
          echo "========================================"
          echo "LAUNCHER ACTIVITY"
          echo "========================================"

          find project -type f -name "AndroidManifest.xml" -print0 |
          while IFS= read -r -d '' MANIFEST
          do
            echo ""
            echo "----- $MANIFEST -----"
            grep -n -E 'package=|<activity|MAIN|LAUNCHER' "$MANIFEST" || true
          done

      - name: Inspect Project Resources
        run: |
          echo "========================================"
          echo "PROJECT RESOURCES"
          echo "========================================"

          find project/DATRIDHA/app/src/main -type f -print | sort

          echo ""
          echo "========================================"
          echo "LAYOUT AND JAVA FILES"
          echo "========================================"

          find project/DATRIDHA/app/src/main -type f \
            \( -name "*.xml" -o -name "*.java" \) -print | sort

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Find Gradle project
        run: |
          echo "========================================"
          echo "GRADLE PROJECT"
          echo "========================================"

          PROJECT_DIR=$(dirname "$(find project \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")

          echo "Gradle project: $PROJECT_DIR"

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")

          echo "Building project:"
          echo "$PROJECT_DIR"

          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Find APK
        run: |
          echo "========================================"
          echo "APK FILE"
          echo "========================================"

          find project -type f -name "app-debug.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DATRIDHA-FINAL
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build DATRIDHA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          set -e

          rm -rf project

          unzip -q DATRIDHA_project_COLORED_FUNCTIONAL_FINAL.zip -d project

          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          find project -type f | sort

      - name: Locate MainActivity
        run: |
          set -e

          TARGET=$(find project -type f -name "MainActivity.java" | head -1)

          if [ -z "$TARGET" ]; then
            echo "ERROR: MainActivity.java not found inside ZIP"
            find project -type f -name "*.java" -print
            exit 1
          fi

          echo "========================================"
          echo "MAIN ACTIVITY FOUND"
          echo "========================================"

          echo "$TARGET"

          echo ""
          echo "SIZE:"
          wc -c "$TARGET"

          echo ""
          echo "FIRST 40 LINES:"
          head -40 "$TARGET"

      - name: Inspect project
        run: |
          echo "========================================"
          echo "GRADLE FILES"
          echo "========================================"

          find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print

          echo ""
          echo "========================================"
          echo "ANDROID MANIFEST"
          echo "========================================"

          find project -type f -name "AndroidManifest.xml" -print

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Find Gradle project
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "========================================"
          echo "GRADLE PROJECT"
          echo "========================================"

          echo "$PROJECT_DIR"

      - name: Build APK
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "========================================"
          echo "BUILDING DATRIDHA"
          echo "========================================"

          gradle -p "$PROJECT_DIR" clean assembleDebug

      - name: Find APK
        run: |
          set -e

          echo "========================================"
          echo "APK"
          echo "========================================"

          APK=$(find project -type f -name "app-debug.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: app-debug.apk not found"
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo ""
          echo "SIZE:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DATRIDHA-FINAL-8-PAGES
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

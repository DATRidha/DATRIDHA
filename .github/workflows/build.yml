name: Build DATRIDHA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare DATRIDHA project
        run: |
          rm -rf project
          unzip -q DATRIDHA_project_COLORED_FUNCTIONAL_FINAL.zip -d project

      - name: Restore MainActivity
        run: |
          mkdir -p project/app/src/main/java/com/datridha/app
          cp project/app/src/main/java/com/datridha/app/MainActivity.java /tmp/old_MainActivity.java
          git show HEAD:project/app/src/main/java/com/datridha/app/MainActivity.java > project/app/src/main/java/com/datridha/app/MainActivity.java

      - name: Verify MainActivity
        run: |
          echo "===== MAIN ACTIVITY ====="
          grep -n "class MainActivity" project/app/src/main/java/com/datridha/app/MainActivity.java
          grep -n "DATRIDHA" project/app/src/main/java/com/datridha/app/MainActivity.java | head -10
          echo "===== END ====="

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: |
          gradle -p project assembleDebug

      - name: Show APK information
        run: |
          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DATRIDHA-FINAL
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

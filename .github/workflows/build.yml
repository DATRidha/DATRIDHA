name: Build DATRIDHA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          set -e

          rm -rf project

          unzip -q DATRIDHA_project_COLORED_FUNCTIONAL_FINAL.zip -d project

          echo "========================================"
          echo "EXTRACTED PROJECT"
          echo "========================================"

          find project -type f -name "settings.gradle*" -print
          find project -type f -name "AndroidManifest.xml" -print

      - name: Install the latest MainActivity
        run: |
          set -e

          SOURCE="project/app/src/main/java/com/datridha/app/MainActivity.java"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: GitHub MainActivity.java not found:"
            echo "$SOURCE"
            exit 1
          fi

          TARGET=$(find project -type f -path "*/app/src/main/java/com/datridha/app/MainActivity.java" | head -1)

          if [ -z "$TARGET" ]; then
            echo "ERROR: Extracted MainActivity.java not found"
            exit 1
          fi

          echo "SOURCE:"
          echo "$SOURCE"

          echo "TARGET:"
          echo "$TARGET"

          cp "$SOURCE" "$TARGET"

          echo ""
          echo "MainActivity installed successfully."

      - name: Verify MainActivity
        run: |
          set -e

          TARGET=$(find project -type f -path "*/app/src/main/java/com/datridha/app/MainActivity.java" | head -1)

          echo "========================================"
          echo "MAIN ACTIVITY USED FOR BUILD"
          echo "========================================"

          echo "FILE:"
          echo "$TARGET"

          echo ""
          echo "SIZE:"
          wc -c "$TARGET"

          echo ""
          echo "IMPORTS:"
          head -30 "$TARGET"

          echo ""
          echo "PAGE METHODS:"
          grep -n -E "showHome|showBuy|showSell|showOrders|showContact|showSettings|showAbout|showDetails" "$TARGET" || true

          echo ""
          echo "VIEWGROUP:"
          grep -n "import android.view.ViewGroup;" "$TARGET" || true

          echo ""
          echo "DATRIDHA:"
          grep -n "DATRIDHA" "$TARGET" | head -20 || true

      - name: Inspect Android project
        run: |
          echo "========================================"
          echo "ANDROID PROJECT"
          echo "========================================"

          find project -type f -name "settings.gradle*" -print
          find project -type f -name "build.gradle*" -print
          find project -type f -name "AndroidManifest.xml" -print

          echo ""
          echo "========================================"
          echo "JAVA AND XML FILES"
          echo "========================================"

          find project -type f \
            \( -name "*.java" -o -name "*.xml" \) \
            -print | sort

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Find Gradle project
        run: |
          set -e

          PROJECT_DIR=$(dirname "$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          echo "Gradle project:"
          echo "$PROJECT_DIR"

      - name: Build APK
        run: |
          set -e

          PROJECT_DIR=$(dirname "$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")

          echo "========================================"
          echo "BUILDING DATRIDHA"
          echo "========================================"

          echo "Project:"
          echo "$PROJECT_DIR"

          gradle -p "$PROJECT_DIR" clean assembleDebug

      - name: Verify APK
        run: |
          set -e

          echo "========================================"
          echo "APK FILE"
          echo "========================================"

          APK=$(find project -type f -name "app-debug.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo ""
          echo "SIZE:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DATRIDHA-FINAL-8-PAGES
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build DATRIDHA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          unzip -q DATRIDHA_project_COLORED_FUNCTIONAL_FINAL.zip -d build_project
          unzip -qo DATRIDHA_READY_BUILD.zip -d build_project

      - name: Find Gradle project
        run: |
          set -e

          SETTINGS=$(find build_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found:"
          echo "$PROJECT_DIR"

      - name: Install visual assets
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable"
          mkdir -p /tmp/datridha_assets

          unzip -q DATRIDHA_UI_ASSETS_READY.zip -d /tmp/datridha_assets

          cp /tmp/datridha_assets/splash_bg.png \
            "$PROJECT_DIR/app/src/main/res/drawable/splash_oasis.png"

          cp /tmp/datridha_assets/oasis_home.png \
            "$PROJECT_DIR/app/src/main/res/drawable/oasis_home.png"

          cp /tmp/datridha_assets/dates_deglet_nour.png \
            "$PROJECT_DIR/app/src/main/res/drawable/dates_deglet_nour.png"

          cp /tmp/datridha_assets/logo_datridha.png \
            "$PROJECT_DIR/app/src/main/res/drawable/app_icon.png"

          echo "Visual assets installed successfully."

      - name: Apply latest MainActivity
        run: |
          set -e

          SOURCE="project/app/src/main/java/com/datridha/app/MainActivity.java"
          DEST="$PROJECT_DIR/app/src/main/java/com/datridha/app/MainActivity.java"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: MainActivity.java source file not found: $SOURCE"
            exit 1
          fi

          mkdir -p "$(dirname "$DEST")"
          cp "$SOURCE" "$DEST"

          echo "MainActivity installed successfully."
          
      - name: Install splash background
        run: |
          set -e

          SOURCE="project/project/app/src/main/res/drawable/image_2bd7123b.jpg"
          DEST="$PROJECT_DIR/app/src/main/res/drawable/image_2bd7123b.jpg"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Splash image not found: $SOURCE"
            find project -type f -name "image_2bd7123b.jpg"
            exit 1
          fi

          mkdir -p "$(dirname "$DEST")"
          cp "$SOURCE" "$DEST"

          echo "Splash image installed:"
          ls -lh "$DEST"
          
      - name: Set application icon
        run: |
          set -e

          MANIFEST=$(find "$PROJECT_DIR/app/src/main" \
            -name "AndroidManifest.xml" \
            -print -quit)

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          ICON="$PROJECT_DIR/app/src/main/res/drawable/app_icon.png"

          if [ ! -s "$ICON" ]; then
            echo "ERROR: App icon file is missing or empty: $ICON"
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          manifest_path = sys.argv[1]
          android_ns = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", android_ns)

          tree = ET.parse(manifest_path)
          root = tree.getroot()

          application = root.find("application")

          if application is None:
              raise SystemExit("ERROR: <application> tag not found")

          icon_key = "{" + android_ns + "}icon"
          round_icon_key = "{" + android_ns + "}roundIcon"

          application.set(icon_key, "@drawable/app_icon")
          application.set(round_icon_key, "@drawable/app_icon")

          tree.write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("Launcher icon configured successfully.")
          print("android:icon = @drawable/app_icon")
          print("android:roundIcon = @drawable/app_icon")
          PY

          echo "Manifest updated:"
          grep -n "app_icon" "$MANIFEST"

          echo "Icon file verified:"
          ls -lh "$ICON"
          
      - name: Copy additional date images
        run: |
          set -e

          SOURCE="DATRIDHA/project/app/src/main/res/drawable"
          DEST="$PROJECT_DIR/app/src/main/res/drawable"

          mkdir -p "$DEST"

          for FILE in \
            image_69792f84.jpg \
            image_562aeaad.jpg \
            dates_basket_1.jpg \
            dates_basket_2.jpg
          do
            if [ ! -f "$SOURCE/$FILE" ]; then
              echo "ERROR: Missing source image: $SOURCE/$FILE"
              exit 1
            fi

            cp "$SOURCE/$FILE" "$DEST/$FILE"
            echo "Copied: $FILE"
          done

          echo "All four date images copied successfully."
          
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: |
          set -e

          gradle -p "$PROJECT_DIR" clean assembleDebug

      - name: Verify APK
        run: |
          set -e

          APK=$(find build_project -type f \
            -path "*/app/build/outputs/apk/debug/app-debug.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: DATRIDHA-FINAL-DESIGN
          path: build_project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

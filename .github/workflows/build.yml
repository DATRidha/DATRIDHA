name: Build DATRIDHA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          unzip -q DATRIDHA_project_COLORED_FUNCTIONAL_FINAL.zip -d build_project
          unzip -qo DATRIDHA_READY_BUILD.zip -d build_project

      - name: Find Gradle project
        run: |
          set -e

          SETTINGS=$(find build_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found:"
          echo "$PROJECT_DIR"

      - name: Install visual assets
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable"

          unzip -q DATRIDHA_UI_ASSETS_READY.zip -d /tmp/datridha_assets

          find /tmp/datridha_assets -type f -maxdepth 2 -print

          cp /tmp/datridha_assets/splash_bg.png \
            "$PROJECT_DIR/app/src/main/res/drawable/splash_oasis.png"

          cp /tmp/datridha_assets/oasis_home.png \
            "$PROJECT_DIR/app/src/main/res/drawable/oasis_home.png"

          cp /tmp/datridha_assets/dates_deglet_nour.png \
            "$PROJECT_DIR/app/src/main/res/drawable/dates_deglet_nour.png"

          cp /tmp/datridha_assets/logo_datridha.png \
            "$PROJECT_DIR/app/src/main/res/drawable/app_icon.png"

          echo "Visual assets installed successfully."

      - name: Apply latest MainActivity
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/app/src/main/java/com/datridha/app"

          cp project/app/src/main/java/com/datridha/app/MainActivity.java \
             "$PROJECT_DIR/app/src/main/java/com/datridha/app/MainActivity.java"

          echo "MainActivity installed successfully."

      - name: Set application icon
        run: |
          set -e

          MANIFEST=$(find "$PROJECT_DIR/app/src/main" \
            -name "AndroidManifest.xml" \
            -print -quit)

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          sed -i \
            's|android:icon="@drawable/[^"]*"|android:icon="@drawable/app_icon"|g' \
            "$MANIFEST"

          echo "Application icon configured."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: |
          set -e

          gradle -p "$PROJECT_DIR" clean assembleDebug

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: DATRIDHA-FINAL-DESIGN
          path: build_project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

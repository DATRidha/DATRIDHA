name: Build DATRIDHA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare complete Android project
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          unzip -q DATRIDHA_project_COLORED_FUNCTIONAL_FINAL.zip -d build_project
          unzip -qo DATRIDHA_READY_BUILD.zip -d build_project

      - name: Find Gradle project
        run: |
          set -e

          SETTINGS=$(find build_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Install DATRIDHA realistic images
        run: |
          set -e

          echo "Preparing DATRIDHA visual assets..."

          mkdir -p build_project/datridha_assets

          unzip -q DATRIDHA_REAL_ASSETS_WEBP.zip \
            -d build_project/datridha_assets

          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable"

          cp build_project/datridha_assets/splash_oasis.webp \
            "$PROJECT_DIR/app/src/main/res/drawable/splash_oasis.webp"

          cp build_project/datridha_assets/oasis_home.webp \
            "$PROJECT_DIR/app/src/main/res/drawable/oasis_home.webp"

          cp build_project/datridha_assets/dates_deglet_nour.webp \
            "$PROJECT_DIR/app/src/main/res/drawable/dates_deglet_nour.webp"

          cp build_project/datridha_assets/app_icon.webp \
            "$PROJECT_DIR/app/src/main/res/drawable/app_icon.webp"

          echo "Images installed successfully."

          ls -lh "$PROJECT_DIR/app/src/main/res/drawable/"

      - name: Apply latest app code
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/app/src/main/java/com/datridha/app"

          cp project/app/src/main/java/com/datridha/app/MainActivity.java \
             "$PROJECT_DIR/app/src/main/java/com/datridha/app/MainActivity.java"

      - name: Apply DATRIDHA application icon
        run: |
          set -e

          MANIFEST=$(find "$PROJECT_DIR/app/src/main" \
            -name "AndroidManifest.xml" \
            -print -quit)

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          echo "Manifest found:"
          echo "$MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if 'android:icon=' in text:
              text = re.sub(
                  r'android:icon="[^"]*"',
                  'android:icon="@drawable/app_icon"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  '<application',
                  '<application android:icon="@drawable/app_icon"',
                  1
              )

          if 'android:roundIcon=' in text:
              text = re.sub(
                  r'android:roundIcon="[^"]*"',
                  'android:roundIcon="@drawable/app_icon"',
                  text,
                  count=1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

          echo "DATRIDHA icon configured."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: |
          set -e

          gradle -p "$PROJECT_DIR" clean assembleDebug

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: DATRIDHA-FINAL-REAL-IMAGES
          path: build_project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build DATRIDHA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          set -e

          rm -rf build_project

          unzip -q DATRIDHA_project_COLORED_FUNCTIONAL_FINAL.zip -d build_project

          echo "========================================"
          echo "PROJECT EXTRACTED"
          echo "========================================"

          find build_project -type f | sort

      - name: Install new MainActivity
        run: |
          set -e

          SOURCE="project/app/src/main/java/com/datridha/app/MainActivity.java"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: New MainActivity.java not found"
            exit 1
          fi

          TARGET=$(find build_project -type f -name "MainActivity.java" | head -1)

          if [ -z "$TARGET" ]; then
            echo "ERROR: MainActivity.java not found inside ZIP"
            exit 1
          fi

          echo "========================================"
          echo "NEW MAIN ACTIVITY"
          echo "========================================"

          echo "SOURCE:"
          echo "$SOURCE"

          echo "TARGET:"
          echo "$TARGET"

          cp "$SOURCE" "$TARGET"

          echo ""
          echo "NEW FILE SIZE:"
          wc -c "$TARGET"

          echo ""
          echo "FIRST 30 LINES:"
          head -30 "$TARGET"

      - name: Find Gradle project
        run: |
          set -e

          SETTINGS=$(find build_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "========================================"
          echo "GRADLE PROJECT"
          echo "========================================"

          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: |
          set -e

          SETTINGS=$(find build_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "========================================"
          echo "BUILDING DATRIDHA"
          echo "========================================"

          gradle -p "$PROJECT_DIR" clean assembleDebug

      - name: Find APK
        run: |
          set -e

          APK=$(find build_project -type f \
            -name "app-debug.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "========================================"
          echo "APK CREATED"
          echo "========================================"

          echo "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DATRIDHA-FINAL-8-PAGES
          path: build_project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

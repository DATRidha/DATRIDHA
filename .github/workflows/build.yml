name: Build DATRIDHA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare complete Android project
        run: |
          set -e
          rm -rf build_project
          mkdir -p build_project

          unzip -q DATRIDHA_project_COLORED_FUNCTIONAL_FINAL.zip -d build_project
          unzip -qo DATRIDHA_READY_BUILD.zip -d build_project

      - name: Find Gradle project
        run: |
          set -e

          SETTINGS=$(find build_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: |
          set -e
          gradle -p "$PROJECT_DIR" clean assembleDebug

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: DATRIDHA-FINAL-EN-AR-FR
          path: build_project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
